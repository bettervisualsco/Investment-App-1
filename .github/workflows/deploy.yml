# Builds the app and publishes it (with the data files) to GitHub Pages.
# Runs when code is pushed to main, when started by hand, and after each data update.

name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      data-artifact:
        description: 'Name of an uploaded artifact holding fresh data/ files'
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the app's packages
        run: npm ci

      - name: Check the code (tests and lint)
        if: inputs.data-artifact == ''
        run: |
          npm test
          npm run lint
          pip install -q -r pipeline/requirements.txt
          python -m pytest -q -c pipeline/pytest.ini pipeline/tests

      - name: Find the website address
        id: pages
        uses: actions/configure-pages@v6

      - name: Use the freshly updated data
        if: inputs.data-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.data-artifact }}
          path: data

      - name: Bring back live-only files from the website
        if: inputs.data-artifact == ''
        run: python pipeline/run.py restore-live --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Build the app
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
